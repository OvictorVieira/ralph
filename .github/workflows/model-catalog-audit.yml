name: Model catalog audit

on:
  schedule:
    - cron: "17 8 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit model catalog
        id: audit
        continue-on-error: true
        run: |
          python3 scripts/audit-model-catalog.py \
            --report model-audit-report.json \
            --summary model-audit-summary.md

      - name: Publish job summary
        if: always() && hashFiles('model-audit-summary.md') != ''
        run: cat model-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always() && hashFiles('model-audit-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: model-catalog-audit-${{ github.run_id }}
          path: |
            model-audit-report.json
            model-audit-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Create or update finding issues
        if: hashFiles('model-audit-report.json') != ''
        uses: actions/github-script@v7
        env:
          REPORT_PATH: model-audit-report.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const { owner, repo } = context.repo;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                return true;
              } catch (error) {
                if (error.status !== 404) {
                  core.warning(`Could not inspect label ${name}: ${error.message}`);
                  return false;
                }
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                  return true;
                } catch (createError) {
                  core.warning(`Could not create label ${name}: ${createError.message}`);
                  return false;
                }
              }
            }

            const baseLabelReady = await ensureLabel(
              'model-audit',
              '5319e7',
              'Automated model catalog audit finding'
            );
            const severityColors = {
              CRITICAL: 'b60205',
              HIGH: 'd93f0b',
              MEDIUM: 'fbca04',
              LOW: '0e8a16'
            };

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            for (const finding of report.findings) {
              const severityLabel = `severity:${finding.severity.toLowerCase()}`;
              const severityLabelReady = await ensureLabel(
                severityLabel,
                severityColors[finding.severity],
                `${finding.severity} model audit finding`
              );

              const title = `${finding.key} ${finding.message}`.slice(0, 256);
              const body = [
                '@OvictorVieira',
                '',
                `Stable key: \`${finding.key}\``,
                `Severity: **${finding.severity}**`,
                `Provider: \`${finding.provider}\``,
                `Model: \`${finding.model}\``,
                `Audit timestamp: \`${finding.auditedAt}\``,
                '',
                '## Finding',
                finding.message,
                '',
                '## Current Ralph catalog metadata',
                '```json',
                JSON.stringify(finding.catalog, null, 2),
                '```',
                '',
                '## Upstream metadata found',
                '```json',
                JSON.stringify(finding.upstream, null, 2),
                '```',
                '',
                '## Sources',
                ...(finding.sourceUrls.length
                  ? finding.sourceUrls.map(url => `- ${url}`)
                  : ['- No source URL recorded']),
                '',
                '## Suggested action',
                finding.suggestedAction
              ].join('\n');

              const existing = issues.find(issue => issue.title.startsWith(finding.key));
              if (existing) {
                if (existing.state === 'closed') {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    state: 'open',
                    title,
                    body
                  });
                } else {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    title,
                    body
                  });
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Finding confirmed again at \`${finding.auditedAt}\`. Report metadata and sources were refreshed in the issue body.`
                });
                continue;
              }

              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [
                  ...(baseLabelReady ? ['model-audit'] : []),
                  ...(severityLabelReady ? [severityLabel] : [])
                ]
              });
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: created.data.number,
                  assignees: ['OvictorVieira']
                });
              } catch (error) {
                core.warning(`Could not assign @OvictorVieira: ${error.message}`);
              }
            }

      - name: Fail for critical findings or audit errors
        if: always()
        run: |
          if [[ "${{ steps.audit.outcome }}" != "success" ]]; then
            echo "Model catalog audit did not complete successfully." >&2
            exit 1
          fi
          source_errors="$(jq -r '.summary.sourceErrors' model-audit-report.json)"
          if [[ "$source_errors" -gt 0 ]]; then
            echo "Model catalog audit could not read $source_errors upstream source(s)." >&2
            exit 1
          fi
          critical_count="$(jq -r '.summary.CRITICAL' model-audit-report.json)"
          if [[ "$critical_count" -gt 0 ]]; then
            echo "Model catalog audit found $critical_count CRITICAL finding(s)." >&2
            exit 1
          fi
